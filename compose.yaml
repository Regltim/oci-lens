name: oci-lens
services:
  server:
    build:
      context: ./server
    image: oci-lens-server:0.1.0
    restart: unless-stopped
    expose: ["9090"]
    environment:
      MONITOR_ADMIN_USERNAME: ${MONITOR_ADMIN_USERNAME:-admin}
      OCI_LENS_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      OCI_MONITOR_DB: /data/oci-lens.db
      OCI_AUTH_MODE: ${OCI_AUTH_MODE:-auto}
      OCI_CONFIG_FILE_PATH: /home/monitor/.oci/config
      OCI_REGION: ${OCI_REGION:-}
      OCI_COMPARTMENT_OCID: ${OCI_COMPARTMENT_OCID:-}
      OCI_TENANCY_OCID: ${OCI_TENANCY_OCID:-}
      OCI_LENS_NETWORK_COMPARTMENT_OCID: ${OCI_LENS_NETWORK_COMPARTMENT_OCID:-}
      OCI_LENS_BILLING_ENABLED: ${OCI_LENS_BILLING_ENABLED:-false}
      OCI_LENS_REQUESTS_PER_DAY: ${OCI_LENS_REQUESTS_PER_DAY:-80}
      OCI_LENS_POINTS_PER_MONTH: ${OCI_LENS_POINTS_PER_MONTH:-100000000}
      MONITOR_COOKIE_SECURE: ${MONITOR_COOKIE_SECURE:-false}
      MONITOR_PUBLIC_URL: ${MONITOR_PUBLIC_URL:-}
      MONITOR_SETTINGS_ENCRYPTION_KEY: ${MONITOR_SETTINGS_ENCRYPTION_KEY:-}
    volumes:
      - lens-data:/data
      - ./secrets/oci:/home/monitor/.oci:ro
      - /proc:/host/proc:ro
    secrets: [admin_password]
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/9090; printf \"GET /api/v1/health HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q \" 200 \"'"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 30s
    logging:
      options: {max-size: "10m", max-file: "3"}
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: oci-lens-web:0.1.0
    restart: unless-stopped
    ports: ["${OCI_LENS_BIND:-127.0.0.1}:${OCI_LENS_PORT:-28462}:8080"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  lens-data:
secrets:
  admin_password:
    file: ./secrets/admin-password
